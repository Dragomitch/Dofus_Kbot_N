spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/dofus_decoder}
    username: ${DATABASE_USER:dofus}
    password: ${DATABASE_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.dofus: INFO
    org.springframework.web: WARN
  file:
    name: /var/log/dofus/dofus-packet-decoder.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

dofus:
  network:
    proxy:
      enabled: ${PROXY_ENABLED:true}
      port: ${PROXY_PORT:5555}
  game:
    packet-logging: ${PACKET_LOGGING:false}
