name: Dependency Update Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-check:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check for updates
        run: mvn versions:display-dependency-updates versions:display-plugin-updates

      - name: Create issue if updates available
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Dependency Updates Available';
            const body = 'Automated dependency check found available updates. Please review and update as necessary.';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['dependencies']
            });
